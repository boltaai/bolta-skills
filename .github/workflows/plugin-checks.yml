name: plugin checks

# The one check that needs no Claude login and no network: the plugin checker
# (against the saved Claude tool list, see tools/fixtures). The behavioural
# evals and `claude plugin validate` need the Claude CLI and run by hand (see the
# README).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Plugin checker
        run: python3 -I tools/check_claude_plugin.py --tools-json tools/fixtures/claude_tools_list.json --strict

