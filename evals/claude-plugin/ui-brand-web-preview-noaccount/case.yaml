schema_version: "1.1"
name: ui-brand-web-preview-noaccount
description: 'The web''s own Brand prompt (lib/ai-apps.ts buildAiAppPrompt brand) for Ferro Bikes from ferrobikes.example, nothing connected. Preview read, the five parts, assumptions, the connect link for the account the voice will use; nothing saved.'
tags: [uiprompts-screens]
expected_outcome: 'bolta fires; extract-business-dna preview true; no saving read; nothing saved; topics and a sample post shown; assumptions flagged; get-connect-link and its link shown.'
execution:
  prompt: |
    Use Bolta to set up our brand for Ferro Bikes from ferrobikes.example. Preview what Bolta learns from the website before saving: what we sell, who we serve, how we write, a few content topics and one sample post. Flag assumptions. Use any notes or writing samples I share to refine the voice. After I confirm, save it and tell me where to review it in Bolta.
  max_turns: 25
  timeout_seconds: 480
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    # The Bolta skill owns this ask.
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(bolta)"'
    min: 1
  - name: reads-site-in-preview
    # Website import in preview first.
    type: 'tool_used'
    tool: 'mcp__plugin_bolta_bolta__extract-business-dna'
    input_match: '"preview"\W{1,6}true'
    min: 1
  - name: no-saving-read
    # Never a saving website read before the yes.
    type: 'tool_used'
    tool: 'mcp__plugin_bolta_bolta__extract-business-dna'
    input_match: '^(?![\s\S]*"(?:preview|check)"\W{1,6}true)'
    min: 0
    max: 0
  - name: nothing-saved
    # Nothing saved before the yes.
    type: 'regex'
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(create-voice-profile|update-voice-profile|update-business-dna|save-post|bulk-create-posts|create-post|create-routine|confirm-plan|create-content-campaign)"'
    target: 'trace'
    match: 'not_contains'
  - name: nothing-public
    # Nothing published, scheduled, approved, switched on, run or started.
    type: 'regex'
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(publish-post|schedule-post|approve-post|approve-many-posts|activate-routine|resume-routine|run-routine-now|set-content-campaign-status|voice-generate)"'
    target: 'trace'
    match: 'not_contains'
  - name: shows-sample-post
    # One sample post.
    type: 'regex'
    pattern: 'sample post|example post|sample \(|\bsample\b'
    flags: 'i'
  - name: flags-assumptions
    # Flags assumptions.
    type: 'regex'
    pattern: 'assum|inferred|my (guess|reading)|not (stated|on the site|from the site)|the site (doesn''t|does not)'
    flags: 'i'
  - name: connect-link
    # No account connected: gets the connect link.
    type: 'tool_used'
    tool: 'mcp__plugin_bolta_bolta__get-connect-link'
    min: 1
  - name: shows-connect-link
    # Shows the connect link (owner rule: the voice needs an account).
    type: 'regex'
    pattern: 'bolta\.ai/dashboard/account/socials'
    flags: 'i'
  - name: asks-before-saving
    # Asks before saving.
    type: 'regex'
    pattern: '(save|right|correct|look good|go ahead|shall I|should I|change)[^?\n]{0,100}\?|say \W{0,3}save'
    flags: 'i'
  - name: no-ids
    # No ids in what the user reads (ids inside a Bolta link are fine).
    type: 'regex'
    pattern: '(?<![/=])\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b|(?<![/=])\b(linkedin_org|facebook_page)_\d+'
    flags: 'i'
    match: 'not_contains'
  - name: plain-words
    # No tool names or internal field names in what the user reads.
    type: 'regex'
    pattern: '\b(MCP|workspace_id|proposal_id|source_bindings?|approval_policy|review_every_artifact|extract-business-dna|create-voice-profile|update-voice-profile|confirm-plan|create-routine|activate-routine|plan-campaign|get-connect-link|list-routine-templates|switch_on|is_default)\b'
    match: 'not_contains'
