schema_version: "1.1"
name: gauntlet-yes-saves-off
description: 'Bolta proposed 4 routines (pasted earlier turn); the beginner says "ya do all of em". All four are saved switched off, and switching on gets its own question.'
tags: [gauntlet]
expected_outcome: 'bolta fires; four saves (confirm-plan without switch_on, or create-routine with ask me first); nothing switched on, run or published; says they are off and asks before switching on.'
execution:
  prompt: |
    Earlier you said:

    > Here are 4 Bolta routines for Wick & Ember Candles:
    > 1. **Scent of the week**: Tuesdays 10:00 am, 2 Instagram and Facebook drafts.
    > 2. **Behind the pour**: Thursdays 12:00 pm, 1 Instagram draft.
    > 3. **Gift ideas**: Saturdays 9:00 am, 1 Instagram and Facebook draft.
    > 4. **Market weekend**: Fridays 8:00 am, 1 Facebook draft.
    >
    > About 5 drafts a week, each waiting for your yes. Which should I set up? They're saved switched off.

    ya do all of em
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    # The Bolta skill owns this ask.
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(bolta)"'
    min: 1
  - name: saves-four
    # All four routines are saved.
    type: regex
    pattern: '(?:"name"\s*:\s*"mcp__plugin_bolta_bolta__(confirm-plan|create-routine)"[\s\S]*){4}'
    target: trace
  - name: create-routine-asks-first
    # A routine saved by hand keeps drafts waiting for a yes.
    type: tool_used
    tool: mcp__plugin_bolta_bolta__create-routine
    input_match: '^(?![\s\S]*"approval_policy"\W{1,6}review_every_artifact)'
    min: 0
    max: 0
  - name: no-switch-on-via-plan
    # confirm-plan never switches on without its own yes.
    type: regex
    pattern: '"switch_on\W{1,6}true'
    target: trace
    match: not_contains
  - name: nothing-public
    # Nothing approved, scheduled, published, switched on, run or started without a yes to those items.
    type: regex
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(publish-post|schedule-post|approve-post|approve-many-posts|activate-routine|resume-routine|run-routine-now|set-content-campaign-status)"'
    target: trace
    match: not_contains
  - name: says-off
    # Says they are saved switched off.
    type: regex
    pattern: 'switched off|turned off|\boff\b|not (on|running)|paused'
    flags: i
  - name: asks-before-switching-on
    # Asks before switching on.
    type: regex
    pattern: '(switch|turn)(ed|ing)?\s+(them|it|all|these|both)?\s*(\w+\s+)?on\b[^?\n]{0,80}\?|activat[^?\n]{0,80}\?'
    flags: i
  - name: no-ids
    # No ids in what the user reads.
    type: regex
    pattern: '\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b|facebook_page_\d'
    flags: i
    match: not_contains
  - name: plain-words
    # Plain words for a beginner: no tool names, internal names or jargon from the never-say list.
    type: regex
    pattern: '\b(MCP|OAuth|connector|fingerprint|workflow definition|source[_ ]binding|template[_ ]key|proposal[_ ]id|workspace_id|Business DNA|Hype[- ]Man|Hunter|Engager|artifact|recommend-routines|confirm-plan|plan-campaign|create-post|reject-post|get-connect-link|extract-business-dna)\b'
    match: not_contains
