schema_version: "1.1"
name: choosing-coffee-instagram-facebook
description: "A cafe on Instagram and Facebook only (no LinkedIn) wants to post regularly. A good pick from chat is weekly text posts for Facebook, maybe customer wins, with one line that Instagram's pictures are added on the routine's page in Bolta; never LinkedIn positions; never a text routine on Instagram; never picture or video settings sent from chat."
tags: [choosing]
expected_outcome: "bolta fires; proposes or saves weekly text post routines for Facebook; Instagram left off any routine made here (it refuses text), with one line and the bolta.ai/dashboard/routines link saying its pictures or video are added on the routine's page; no media_mode, media_prompt, visual_style, image_model or carousel settings sent; no linkedin_thought_leadership and nothing on LinkedIn; nothing switched on."
execution:
  prompt: |
    I own Northwind Coffee, a small cafe. We only use Instagram and Facebook. I want to post regularly without having to think about it. What should I set up?
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    # The Bolta skill owns choosing what to set up.
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(bolta)"'
    min: 1
  - name: no-linkedin-positions
    # LinkedIn positions need LinkedIn, which this cafe does not use.
    type: tool_used
    tool: mcp__plugin_bolta_bolta__create-routine
    input_match: 'linkedin'
    min: 0
    max: 0
  - name: never-offers-linkedin-positions
    # Not offered in the reply either.
    type: regex
    pattern: 'linkedin_thought_leadership|thought leadership|LinkedIn positions'
    flags: i
    match: not_contains
  - name: weekly-rhythm
    # A weekly rhythm, not daily.
    type: regex
    pattern: '\b(every|each)\s+(mon|tues|wednes|thurs|fri|satur|sun)day|\bweekly\b|\ba week\b'
    flags: i
  - name: pictures-for-instagram
    # Says Instagram needs pictures or video.
    type: regex
    pattern: '\b(images?|photos?|pictures?|videos?|reels?)\b'
    flags: i
  - name: pictures-on-routine-page
    # One line, one link: pictures and video for a routine are added on its page in Bolta (or a one-off image in AI Studio).
    type: regex
    pattern: 'bolta\.ai/dashboard/(routines|ai-studio)'
    flags: i
  - name: no-text-routine-on-instagram
    # A routine made from chat writes text, and Instagram refuses text-only posts: never bound to Instagram.
    type: tool_used
    tool: mcp__plugin_bolta_bolta__create-routine
    input_match: 'a1b2c3d4-0001-4a00-8000-000000000003|"platforms?"\W{1,6}[^\]}]*instagram'
    min: 0
    max: 0
  - name: no-generated-media
    # Pictures and video are never set up from chat: a routine carrying media_mode image, video or carousel,
    # media_prompt, visual_style, image_model, carousel_config, a reference image or library_media fails.
    type: tool_used
    tool: mcp__plugin_bolta_bolta__create-routine
    input_match: '"media_mode\\?"\W{1,8}(image|video|carousel)|"(media_prompt|visual_style|image_model|carousel_config|reference_media_id|reference_image_url|library_media)\\?"\s*:'
    min: 0
    max: 0
  - name: no-image-prompts
    # Never writes image ideas, image prompts, video scripts or scene descriptions for Bolta to render.
    type: regex
    pattern: '\b(image|video|visual)\s+(prompts?|scripts?)\b|\bimage ideas?\b|\bscene descriptions?\b|\bstoryboards?\b'
    flags: i
    match: not_contains
  - name: nothing-public
    # Nothing approved, scheduled, published, switched on, run or started without its own yes.
    type: regex
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(publish-post|schedule-post|approve-post|approve-many-posts|activate-routine|resume-routine|run-routine-now|set-content-campaign-status|submit-for-review)"'
    target: trace
    match: not_contains
  - name: no-ids
    # No ids in what the user reads.
    type: regex
    pattern: '\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b'
    flags: i
    match: not_contains
