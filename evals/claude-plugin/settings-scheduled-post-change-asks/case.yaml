schema_version: "1.1"
name: settings-scheduled-post-change-asks
description: 'A Threads topic tag on a post that is approved and scheduled. Any real change to text or a setting on an Approved or Scheduled post sends it back to waiting for a yes (approval_reset; post-per-network.md, post-settings.md). So the plugin finds the post, says the change sends it back for a new yes and asks before changing anything: no update call in this reply, nothing approved, scheduled or posted.'
tags: [settings]
expected_outcome: 'post or review fires; reads the post from Bolta; no update-post or details change; says the change takes it off the schedule until a new yes; asks whether to go ahead.'
execution:
  prompt: |
    Earlier you showed me what's scheduled for Northwind Coffee:

    1. Threads (@northwindcoffee) and X (@northwindcoffee), Thu Nov 19, 9:00 am: "Guji is back. Bright, floral, and only here till the bags run out." Approved and scheduled.

    Add the topic tag Coffee to the Threads version.
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(bolta)"'
    min: 1
  - name: playbook-read
    type: tool_used
    tool: Read
    input_match: 'references/(post|review)\.md'
    min: 1
  - name: finds-the-post
    # The post id is only in Bolta.
    type: regex
    target: mock_calls
    pattern: '"tool":"[^"]*(list-scheduled-posts|list-workspace-posts|get-post)"'
  - name: no-update-yet
    # Asked first: no change in this reply.
    type: tool_used
    tool: mcp__plugin_bolta_bolta__save-post
    input_match: '^(?=[\s\S]*"post_id")'
    min: 0
    max: 0
  - name: no-details-change-yet
    type: tool_used
    tool: mcp__plugin_bolta_bolta__save-post
    input_match: '"platform_details"'
    min: 0
    max: 0
  - name: says-back-for-a-yes
    type: regex
    pattern: 'back (to|for|into|in) (review|approval|pending|waiting|your (yes|ok|okay|approval|sign.?off))|need(s)? (your |a )?(new |fresh |another )?(yes|approval|sign.?off|ok)|un.?approv|unschedul|off the (schedule|calendar)|approv\w* (it )?again|re-?approv|(lose|lift|drop|void|reset)s? (its|the|your) (approval|yes|sign.?off)'
    flags: i
  - name: asks-first
    type: regex
    pattern: '(want me to|shall I|should I|ok(ay)? to|go ahead|do you want|would you like|still want|happy (for me )?to|confirm)[^\n]*\?|\?\s*$'
    flags: i
  - name: no-delete
    type: tool_used
    tool: mcp__plugin_bolta_bolta__delete-post
    min: 0
    max: 0
  - name: no-approve-schedule-publish
    # Drafts only: nothing approved, scheduled or posted.
    type: regex
    target: trace
    pattern: '"name":"mcp__plugin_bolta_bolta__(approve-post|approve-many-posts|schedule-post|publish-post)"'
    match: not_contains
  - name: no-ids-or-jargon
    type: regex
    pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-|linkedin_org_|platform_specific|\bcreate-post\b|\bupdate-post\b|topic_tag|approval_reset|\bMCP\b'
    flags: i
    match: not_contains
