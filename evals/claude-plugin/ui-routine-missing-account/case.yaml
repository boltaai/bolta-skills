schema_version: "1.1"
name: ui-routine-missing-account
description: 'The routine panel prompt for a network that isn''t connected: Ferro Bikes, five Threads posts each week, only Instagram connected. The missing detail is the account: connect link, no silent switch to Instagram, nothing saved.'
tags: [uiprompts]
expected_outcome: 'bolta fires; reads accounts; get-connect-link with its link; says Threads isn''t connected; never moves it to Instagram unasked; nothing saved; at most 2 questions.'
execution:
  prompt: |
    Use Bolta to prepare a draft routine for Ferro Bikes that writes five Threads posts each week. Use our saved brand voice and a routine template that supports this.

    Show me what each run produces, the schedule and timezone, the destination account, and who reviews the drafts. Ask only for missing setup details.

    After I confirm, save it as a draft with review required for every post. Link me to the routine in Bolta and ask separately before turning it on.
  max_turns: 25
  timeout_seconds: 480
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    # The Bolta skill owns this ask.
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(bolta)"'
    min: 1
  - name: reads-accounts
    # Reads which accounts exist.
    type: 'regex'
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__list-accounts"'
    target: 'trace'
  - name: connect-link
    # Gets the connect link for Threads.
    type: 'tool_used'
    tool: 'mcp__plugin_bolta_bolta__get-connect-link'
    min: 1
  - name: shows-connect-link
    # Shows it.
    type: 'regex'
    pattern: 'bolta\.ai/dashboard/account/socials'
    flags: 'i'
  - name: says-not-connected
    # Says Threads isn't connected.
    type: 'regex'
    pattern: 'Threads[^.\n]{0,80}(not|isn''t|no)[^.\n]{0,30}connect|(no|not|isn''t)[^.\n]{0,40}Threads[^.\n]{0,40}connect|connect[^.\n]{0,60}Threads'
    flags: 'i'
  - name: nothing-saved
    # Nothing saved.
    type: 'regex'
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(save-post|bulk-create-posts|create-post|create-routine|confirm-plan|create-content-campaign|create-voice-profile|update-voice-profile|update-business-dna)"'
    target: 'trace'
    match: 'not_contains'
  - name: nothing-public
    # Nothing published, scheduled, approved, switched on, run or started.
    type: 'regex'
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(publish-post|schedule-post|approve-post|approve-many-posts|activate-routine|resume-routine|run-routine-now|set-content-campaign-status|voice-generate)"'
    target: 'trace'
    match: 'not_contains'
  - name: shows-timezone
    # The timezone.
    type: 'regex'
    pattern: 'London|UK time|\bGMT\b|\bBST\b'
    flags: 'i'
  - name: at-most-two-questions
    # Asks only for what is missing: at most 2 questions (lines with a question mark; an either/or on one line is one).
    type: 'regex'
    pattern: '(?:\?[^\n]*(?:\n|$)[\s\S]*?){3}'
    match: 'not_contains'
  - name: no-ids
    # No ids in what the user reads (ids inside a Bolta link are fine).
    type: 'regex'
    pattern: '(?<![/=])\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b|(?<![/=])\b(linkedin_org|facebook_page)_\d+'
    flags: 'i'
    match: 'not_contains'
  - name: plain-words
    # No tool names or internal field names in what the user reads.
    type: 'regex'
    pattern: '\b(MCP|workspace_id|proposal_id|source_bindings?|approval_policy|review_every_artifact|extract-business-dna|create-voice-profile|update-voice-profile|confirm-plan|create-routine|activate-routine|plan-campaign|get-connect-link|list-routine-templates|switch_on|is_default)\b'
    match: 'not_contains'
