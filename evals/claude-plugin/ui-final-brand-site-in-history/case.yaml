schema_version: "1.1"
name: ui-final-brand-site-in-history
description: "Final no-site Brand prompt for Harbor Physio, but the user named the site earlier in the chat: the AI shows it as a finding and previews it, never asks for it."
tags: [uiprompts]
expected_outcome: "bolta fires; extract-business-dna preview with harborphysio.example; no website question; nothing saved."
execution:
  prompt: |
    This conversation so far:

    **Me:**
    > Quick one before Bolta: I'm Anna Ruiz and I run Harbor Physio in Williamstown. Most of our people are weekend runners, tradies and new mums getting back to exercise. We do sports massage, rehab plans and small-group Pilates. I write short and plain, like a friendly coach, never like a medical brochure, and I hate hashtag walls. Our site is harborphysio.example.

    **You:**
    > Got it, Anna: Harbor Physio, Williamstown, for weekend runners, tradies and new mums; sports massage, rehab plans and small-group Pilates; short, plain, friendly-coach writing, no hashtag walls. Site: harborphysio.example.

    **Me now:**
    Use Bolta to set up our brand for Harbor Physio. If no social accounts are connected, give me the link to connect one first. First, look through what you know about me and our business from our chats and show me what you found: what we do, our website, who we serve, our products and how I write. Ask only for what's missing, our website first if you didn't find it. If we don't have one, build it from what you found plus any notes I share. Preview before saving: positioning, products, writing rules, topics and a sample post. Flag assumptions. Only after I say yes, save it, assign the voice to our connected accounts, and link me to review it in Bolta.
  max_turns: 25
  timeout_seconds: 480
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    # The Bolta skill owns this ask.
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(bolta)"'
    min: 1
  - name: previews-the-site
    # The site from the history, previewed.
    type: 'tool_used'
    tool: 'mcp__plugin_bolta_bolta__extract-business-dna'
    input_match: 'harborphysio\.example[\s\S]*"preview"\W{1,6}true|"preview"\W{1,6}true[\s\S]*harborphysio\.example'
    min: 1
  - name: no-setup-yet
    # Only a preview (or a status check) before the yes: never a setup or a saving read.
    type: 'tool_used'
    tool: 'mcp__plugin_bolta_bolta__extract-business-dna'
    input_match: '^(?![\s\S]*"(?:preview|check)"\W{1,6}true)'
    min: 0
    max: 0
  - name: nothing-saved
    # A preview or a question, not a save.
    type: 'regex'
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(save-post|bulk-create-posts|create-post|create-routine|confirm-plan|create-content-campaign|create-voice-profile|update-voice-profile|update-business-dna)"'
    target: 'trace'
    match: 'not_contains'
  - name: nothing-public
    # Nothing published, scheduled, approved, switched on, run or started.
    type: 'regex'
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(publish-post|schedule-post|approve-post|approve-many-posts|activate-routine|resume-routine|run-routine-now|set-content-campaign-status|voice-generate)"'
    target: 'trace'
    match: 'not_contains'
  - name: does-not-ask-for-site
    # The site was already given: never asked again.
    type: 'regex'
    pattern: '(what''?s|what is|share|send|have)[^?\n]{0,40}(your|a) (web)?site[^?\n]{0,60}\?'
    flags: 'i'
    match: 'not_contains'
  - name: shows-findings
    # Shows what it knows from the chat.
    type: 'regex'
    pattern: 'runners|tradies|new mums'
    flags: 'i'
  - name: at-most-two-questions
    # At most 2 questions in the reply.
    type: 'regex'
    pattern: '(?:\?(?=[\s*_)\]]|$)[\s\S]*){3}'
    match: 'not_contains'
  - name: no-ids
    # No ids in what the user reads (ids inside a Bolta link are fine).
    type: 'regex'
    pattern: '(?<![/=])\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b|(?<![/=])\b(linkedin_org|facebook_page)_\d+'
    flags: 'i'
    match: 'not_contains'
  - name: plain-words
    # No tool names or internal field names in what the user reads.
    type: 'regex'
    pattern: '\b(MCP|workspace_id|proposal_id|source_bindings?|approval_policy|review_every_artifact|extract-business-dna|create-voice-profile|update-voice-profile|confirm-plan|create-routine|activate-routine|plan-campaign|get-connect-link|list-routine-templates|switch_on|is_default|replace_voice|writing_samples)\b'
    match: 'not_contains'
