schema_version: "1.1"
name: ui-routine-instagram-preview
description: 'The routine panel prompt with another network and cadence: Harbor Physio, two Instagram posts each week. Instagram needs a picture or video for every post, and a routine made from chat writes text, so Bolta never plans or saves a text routine to Instagram and never sets up pictures from chat: it says in one line that pictures and video are added on the routine''s page in Bolta, with the link. Before the media rule this case graded the shown plan (output, schedule, Melbourne time, reviewer); those graders were dropped because that plan was a text routine to Instagram.'
tags: [uiprompts-screens]
expected_outcome: 'bolta fires; reads the voice; names the Instagram account; says Instagram needs a picture or video and that they are added on the routine''s page (bolta.ai/dashboard/routines); no text routine planned to Instagram as if it could run; no picture or video settings sent and no image prompts written; nothing saved.'
execution:
  prompt: |
    Use Bolta to prepare a draft routine for Harbor Physio that writes two Instagram posts each week. Use our saved brand voice and a routine template that supports this.

    Show me what each run produces, the schedule and timezone, the destination account, and who reviews the drafts. Ask only for missing setup details.

    After I confirm, save it as a draft with review required for every post. Link me to the routine in Bolta and ask separately before turning it on.
  max_turns: 25
  timeout_seconds: 480
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    # The Bolta skill owns this ask.
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(bolta)"'
    min: 1
  - name: reads-voice
    # Uses the saved voice.
    type: 'regex'
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(get-voice-context|get-voice-profile)"'
    target: 'trace'
  - name: nothing-saved
    # Nothing saved before the confirm.
    type: 'regex'
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(save-post|bulk-create-posts|create-post|create-routine|confirm-plan|create-content-campaign|create-voice-profile|update-voice-profile|update-business-dna)"'
    target: 'trace'
    match: 'not_contains'
  - name: nothing-public
    # Nothing published, scheduled, approved, switched on, run or started.
    type: 'regex'
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(publish-post|schedule-post|approve-post|approve-many-posts|activate-routine|resume-routine|run-routine-now|set-content-campaign-status|voice-generate)"'
    target: 'trace'
    match: 'not_contains'
  - name: shows-destination
    # The destination account.
    type: 'regex'
    pattern: '@?harborphysio|Harbor Physio[^\n]{0,20}Instagram|Instagram[^\n]{0,30}(account|Harbor)'
    flags: 'i'
  - name: instagram-needs-media
    # Instagram needs a picture or video.
    type: 'regex'
    pattern: '(image|photo|picture|video|visual|media)'
    flags: 'i'
  - name: pictures-on-routine-page
    # One line, one link: pictures and video for a routine are added on its page in Bolta.
    type: 'regex'
    pattern: 'bolta\.ai/dashboard/routines'
    flags: 'i'
  - name: no-generated-media
    # Pictures and video are never set up from chat. Fails on any Bolta call carrying media_mode image, video or
    # carousel, media_prompt, visual_style, image_model, carousel_config, a reference image, library_media,
    # custom_image_instructions, or a still_image, carousel, short_video, feed_video, story or avatar_video mix key.
    type: regex
    target: trace
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__[\w-]+"\s*,\s*"input"\s*:\s*\{(?=[^\n]*?(?:"media_mode\\?"\W{1,8}(?:image|video|carousel)|"(?:media_prompt|visual_style|image_model|carousel_config|reference_media_id|reference_image_url|library_media|custom_image_instructions)\\?"\s*:|"content_mix\\?"\W{1,4}\{[^{}]*"(?:still_image|carousel|short_video|feed_video|story|avatar_video)\\?"\s*:))'
    match: not_contains
  - name: no-image-prompts
    # Never writes image ideas, image prompts, video scripts or scene descriptions for Bolta to render.
    type: 'regex'
    pattern: '\b(image|video|visual)\s+(prompts?|scripts?)\b|\bimage ideas?\b|\bscene descriptions?\b|\bstoryboards?\b'
    flags: 'i'
    match: 'not_contains'
  - name: at-most-two-questions
    # Asks only for what is missing: at most 2 questions (lines with a question mark; an either/or on one line is one).
    type: 'regex'
    pattern: '(?:\?[^\n]*(?:\n|$)[\s\S]*?){3}'
    match: 'not_contains'
  - name: no-ids
    # No ids in what the user reads (ids inside a Bolta link are fine).
    type: 'regex'
    pattern: '(?<![/=])\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b|(?<![/=])\b(linkedin_org|facebook_page)_\d+'
    flags: 'i'
    match: 'not_contains'
  - name: plain-words
    # No tool names or internal field names in what the user reads.
    type: 'regex'
    pattern: '\b(MCP|workspace_id|proposal_id|source_bindings?|approval_policy|review_every_artifact|extract-business-dna|create-voice-profile|update-voice-profile|confirm-plan|create-routine|activate-routine|plan-campaign|get-connect-link|list-routine-templates|switch_on|is_default)\b'
    match: 'not_contains'
