schema_version: "1.1"
name: gauntlet-draft-quality-coffee-threads
description: 'Three Threads posts for a small coffee roaster, mostly about its new Ethiopia, shown before saving. Graded on craft: names the real coffees and their listed tasting notes, in its voice, no stock AI phrases or banned words, at most one hashtag, Threads length, nothing invented (no farms, altitudes, recipes, prices or scarcity).'
tags: [gauntlet]
expected_outcome: 'bolta fires; reads the voice; nothing saved (asked not to); names real products or services; no filler phrases; hashtags within the voice cap; no invented numbers; two llm rubric checks pass.'
execution:
  prompt: |
    need 3 threads posts for lantern this week, mostly about the new ethiopia. just show me the text first, dont save anything yet
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    # The Bolta skill owns this ask.
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(bolta)"'
    min: 1
  - name: reads-the-voice
    # Writes from the brand's voice.
    type: tool_used
    tool: mcp__plugin_bolta_bolta__get-voice-context
    min: 1
  - name: nothing-saved
    # Asked not to save.
    type: regex
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(create-post|bulk-create-posts)"'
    target: trace
    match: not_contains
  - name: nothing-public
    # Nothing approved, scheduled, published, switched on, run or started without a yes to those items.
    type: regex
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(publish-post|schedule-post|approve-post|approve-many-posts|activate-routine|resume-routine|run-routine-now|set-content-campaign-status)"'
    target: trace
    match: not_contains
  - name: names-real-products
    # Writes about the new coffee by its real name.
    type: regex
    pattern: 'Guji'
    flags: i
  - name: no-ai-filler
    # No stock AI phrases, and none the voice bans.
    type: regex
    pattern: 'fast-paced world|in today.s|\belevate|\bindulge|\bunleash|\bunlock|game[- ]changer|look no further|dive into|\bembark|\bjourney\b|tapestry|symphony|treat yourself|must-have|perfect blend|warm embrace|artisanal|curated'
    flags: i
    match: not_contains
  - name: no-hashtag-stuffing
    # The voice allows at most one hashtag.
    type: regex
    pattern: '(?:#[A-Za-z]\w*[\s,]*){2,}'
    match: not_contains
  - name: no-invented-numbers
    # The record has no prices, percentages, counts or durations.
    type: regex
    pattern: '\$\s?\d|\b\d{1,3}\s?%|\b\d+\s?(reviews|stars|customers|clients|companies|teams|patients|families|hours|days|weeks|months|years|minutes|x)\b'
    flags: i
    match: not_contains
  - name: fits-threads
    # No single line longer than Threads's 500 characters.
    type: regex
    pattern: '[^\n]{501,}'
    match: not_contains
  - name: no-ids
    # No ids in what the user reads.
    type: regex
    pattern: '\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b|facebook_page_\d'
    flags: i
    match: not_contains
  - name: specific-and-grounded
    # Top-tier drafts are about this business, and say nothing Bolta does not hold.
    type: llm
    criteria: |
      Business facts the assistant was given by Bolta (the only facts it has): Lantern Coffee Roasters, a small coffee roaster in Portland, Maine; website lanterncoffee.example. Roasts on Tuesdays and ships on Wednesdays. Harbor Blend: medium roast, milk chocolate and toasted almond, for espresso or drip. New this month: Ethiopia Guji, a natural-process light roast that tastes of blueberry and jasmine. Night Shift Decaf: Swiss Water process, cocoa and brown sugar. Sold online and at the tasting bar on Commercial Street. Subscriptions every two weeks or every month. Posts go to the @lanterncoffee Threads account. There are NO prices, bag sizes, farm, producer, washing station or village names, altitudes, varieties, harvest dates, cupping scores, awards, limited quantities, brew recipes or ratios, food or pastries, or opening hours anywhere in what Bolta holds.

      The user asked for 3 Threads posts this week, mostly about the new Ethiopia. PASS only if the reply contains 3 distinct posts, at least two are about Ethiopia Guji, every one names a real Lantern coffee from the list above and says what it tastes like or how it is roasted as listed, and no post states a fact not in the list (no prices, bag sizes, farm, producer or village names, altitudes, varieties, harvest dates, scores, awards, 'limited' or 'only so many bags', brew recipes, ratios or temperatures, tasting notes beyond those listed, food, or hours). Otherwise FAIL.
  - name: voice-and-craft
    # Reads like the business wrote it, not like generic AI copy.
    type: llm
    criteria: |
      The brand voice: easygoing, curious, plain; the roaster pouring you a taster at the bar. DO: name the coffee and what it tastes like; talk as the roasters ('we roast'); one thought per post. DON'T: more than one hashtag; invented numbers, prices or awards; the words 'artisanal' or 'curated'.

      PASS only if every one of the 3 Threads posts in the reply: follows the DOs and DON'Ts above; has at most one hashtag; is at most 500 characters; contains none of these stock phrases: 'In today's fast-paced world', 'elevate', 'indulge', 'treat yourself', 'look no further', 'perfect blend', 'artisanal', 'curated', 'journey'; and reads like a person at a small roaster talking plainly, not an ad. Otherwise FAIL.
