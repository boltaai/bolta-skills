schema_version: "1.1"
name: gauntlet-one-word-answers
description: 'A beginner answers questions with one word ("candles", then "insta"). Empty workspace, no site yet. Bolta stops asking; Instagram needs pictures, which a routine gets on its page in Bolta, so it says that in one line with the link instead of planning a text routine to Instagram or setting up pictures from chat; plus the connect link; nothing saved.'
tags: [gauntlet]
expected_outcome: 'bolta fires; does not ask again what they sell; repeating work offered for Instagram only; says Instagram needs pictures or video and that they are added on the routine''s page (bolta.ai/dashboard/routines) or, for a one-off, in AI Studio; no picture or video settings sent and no image prompts written; connect link; at most 2 questions; nothing saved or public.'
execution:
  prompt: |
    Earlier in this chat:

    Me: i want to do social media for my shop
    You: Happy to help. What do you sell?
    Me: candles
    You: Nice. Where do you want to post: Instagram, Facebook, TikTok, somewhere else?

    insta
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    # The Bolta skill owns this ask.
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(bolta)"'
    min: 1
  - name: no-reask
    # Never asks again what they sell or where they post.
    type: regex
    pattern: 'what (do|does) (you|your (shop|business|store)) sell|which (networks?|platforms?)[^?\n]{0,60}\?|where (do|would) you (like to |want to )?post'
    flags: i
    match: not_contains
  - name: offers-repeating-work
    # Offers repeating work (a routine), not a pile of one-off posts. A routine made from chat writes text and
    # Instagram refuses text, so the planner is no longer required here: one with pictures is set up on its page.
    type: regex
    pattern: '\broutines?\b|\bevery (week|day|mon|tues|wednes|thurs|fri|satur|sun)|\bweekly\b|\bon repeat\b'
    flags: i
  - name: connect-link
    # Instagram is not connected: the connect link.
    type: tool_used
    tool: mcp__plugin_bolta_bolta__get-connect-link
    min: 1
  - name: instagram-only
    # Only the network they named.
    type: regex
    pattern: '\bLinkedIn\b|\bX \(|\bTwitter\b'
    match: not_contains
  - name: pictures-for-instagram
    # Says Instagram needs pictures or video.
    type: regex
    pattern: '\b(images?|photos?|pictures?|videos?|reels?)\b'
    flags: i
  - name: pictures-on-routine-page
    # One line, one link: pictures and video for a routine are added on its page in Bolta (a one-off image in AI Studio).
    type: regex
    pattern: 'bolta\.ai/dashboard/(routines|ai-studio)'
    flags: i
  - name: no-generated-media
    # Pictures and video are never set up from chat. Fails on any Bolta call carrying media_mode image, video or
    # carousel, media_prompt, visual_style, image_model, carousel_config, a reference image, library_media,
    # custom_image_instructions, or a still_image, carousel, short_video, feed_video, story or avatar_video mix key.
    type: regex
    target: trace
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__[\w-]+"\s*,\s*"input"\s*:\s*\{(?=[^\n]*?(?:"media_mode\\?"\W{1,8}(?:image|video|carousel)|"(?:media_prompt|visual_style|image_model|carousel_config|reference_media_id|reference_image_url|library_media|custom_image_instructions)\\?"\s*:|"content_mix\\?"\W{1,4}\{[^{}]*"(?:still_image|carousel|short_video|feed_video|story|avatar_video)\\?"\s*:))'
    match: not_contains
  - name: no-image-prompts
    # Never writes image ideas, image prompts, video scripts or scene descriptions for Bolta to render.
    type: regex
    pattern: '\b(image|video|visual)\s+(prompts?|scripts?)\b|\bimage ideas?\b|\bscene descriptions?\b|\bstoryboards?\b'
    flags: i
    match: not_contains
  - name: fits-the-business
    # About candles.
    type: regex
    pattern: 'candle|scent|pour|wax|gift'
    flags: i
  - name: at-most-two-questions
    # At most 2 questions in the reply.
    type: regex
    pattern: '(?:\?(?=[\s*_)\]]|$)[\s\S]*){3}'
    match: not_contains
  - name: nothing-saved-yet
    # A proposal, not a setup: no routine, campaign or post saved before a yes.
    type: regex
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(confirm-plan|create-routine|create-content-campaign|create-post|bulk-create-posts|save-post)"'
    target: trace
    match: not_contains
  - name: nothing-public
    # Nothing approved, scheduled, published, switched on, run or started without a yes to those items.
    type: regex
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(publish-post|schedule-post|approve-post|approve-many-posts|activate-routine|resume-routine|run-routine-now|set-content-campaign-status)"'
    target: trace
    match: not_contains
  - name: no-ids
    # No ids in what the user reads.
    type: regex
    pattern: '\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b|facebook_page_\d'
    flags: i
    match: not_contains
  - name: plain-words
    # Plain words for a beginner: no tool names, internal names or jargon from the never-say list.
    type: regex
    pattern: '\b(MCP|OAuth|connector|fingerprint|workflow definition|source[_ ]binding|template[_ ]key|proposal[_ ]id|workspace_id|Business DNA|Hype[- ]Man|Hunter|Engager|artifact|recommend-routines|confirm-plan|plan-campaign|create-post|reject-post|get-connect-link|extract-business-dna)\b'
    match: not_contains
