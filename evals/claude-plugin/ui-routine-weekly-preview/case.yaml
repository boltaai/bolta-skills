schema_version: "1.1"
name: ui-routine-weekly-preview
description: 'The live routine panel prompt for DevConsole: three LinkedIn posts each week, saved voice, a fitting template. Shows each run''s output, the schedule and timezone, the LinkedIn page, who reviews; asks only for what is missing; saves nothing.'
tags: [uiprompts-screens]
expected_outcome: 'bolta fires; reads the voice; uses Bolta''s planner or the template list; shows output, schedule, timezone, account, reviewer; at most 2 questions; nothing saved or switched on.'
execution:
  prompt: |
    Use Bolta to prepare a draft routine for DevConsole that writes three LinkedIn posts each week. Use our saved brand voice and a routine template that supports this.

    Show me what each run produces, the schedule and timezone, the destination account, and who reviews the drafts. Ask only for missing setup details.

    After I confirm, save it as a draft with review required for every post. Link me to the routine in Bolta and ask separately before turning it on.
  max_turns: 25
  timeout_seconds: 480
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    # The Bolta skill owns this ask.
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(bolta)"'
    min: 1
  - name: reads-voice
    # Uses the saved voice.
    type: 'regex'
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(get-voice-context|get-voice-profile)"'
    target: 'trace'
  - name: fitting-template
    # A routine template or Bolta's plan.
    type: 'regex'
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(plan|list-routine-templates)"'
    target: 'trace'
  - name: nothing-saved
    # Nothing saved before the confirm.
    type: 'regex'
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(save-post|bulk-create-posts|create-post|create-routine|confirm-plan|create-content-campaign|create-voice-profile|update-voice-profile|update-business-dna)"'
    target: 'trace'
    match: 'not_contains'
  - name: nothing-public
    # Nothing published, scheduled, approved, switched on, run or started.
    type: 'regex'
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(publish-post|schedule-post|approve-post|approve-many-posts|activate-routine|resume-routine|run-routine-now|set-content-campaign-status|voice-generate)"'
    target: 'trace'
    match: 'not_contains'
  - name: shows-output
    # What each run produces.
    type: 'regex'
    pattern: '\b(3|three)\b[^\n]{0,60}(LinkedIn )?(post|draft)'
    flags: 'i'
  - name: shows-schedule
    # Day and time.
    type: 'regex'
    pattern: '(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*\W[^\n]{0,40}\d{1,2}(:\d\d)?\s?(am|pm|AM|PM)?|\d{1,2}:\d\d'
    flags: 'i'
  - name: shows-timezone
    # The timezone.
    type: 'regex'
    pattern: 'Pacific|Los Angeles|\bPT\b|\bPST\b'
    flags: 'i'
  - name: shows-reviewer
    # Who reviews the drafts.
    type: 'regex'
    pattern: 'review(s|ed|er|ers)?\b[^\n]{0,80}(you|Priya|Marcus|owner|approve)|(you|Priya|Marcus)[^\n]{0,60}review|who should review'
    flags: 'i'
  - name: shows-destination
    # The destination account.
    type: 'regex'
    pattern: 'LinkedIn (company )?page|DevConsole (LinkedIn|page)|LinkedIn[^\n]{0,30}DevConsole'
    flags: 'i'
  - name: asks-to-confirm
    # Waits for the confirm before saving (a question or 'once you confirm').
    type: 'regex'
    pattern: '(save|set (it )?up|confirm|go ahead)[^?\n]{0,80}\?|(once|when|after) you (confirm|say|answer)'
    flags: 'i'
  - name: at-most-two-questions
    # Asks only for what is missing: at most 2 questions (lines with a question mark; an either/or on one line is one).
    type: 'regex'
    pattern: '(?:\?[^\n]*(?:\n|$)[\s\S]*?){3}'
    match: 'not_contains'
  - name: no-ids
    # No ids in what the user reads (ids inside a Bolta link are fine).
    type: 'regex'
    pattern: '(?<![/=])\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b|(?<![/=])\b(linkedin_org|facebook_page)_\d+'
    flags: 'i'
    match: 'not_contains'
  - name: plain-words
    # No tool names or internal field names in what the user reads.
    type: 'regex'
    pattern: '\b(MCP|workspace_id|proposal_id|source_bindings?|approval_policy|review_every_artifact|extract-business-dna|create-voice-profile|update-voice-profile|confirm-plan|create-routine|activate-routine|plan-campaign|get-connect-link|list-routine-templates|switch_on|is_default)\b'
    match: 'not_contains'
