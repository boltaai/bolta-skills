schema_version: "1.1"
name: gauntlet-vague-help
description: 'A beginner says only "help me with social media". Bolta already knows the business from its site and Instagram and Facebook are connected; there is no voice and nothing running. The first reply proposes 3-5 Bolta routines for a candle maker and the voice, without making the user explain their business.'
tags: [gauntlet]
expected_outcome: 'bolta fires; looks (accounts); never re-reads the site (a business record exists); asks the planner; 3 to 5 weekly routines for a candle business in the reply; voice mentioned; at most 2 questions; nothing saved, nothing public; plain words, no ids.'
execution:
  prompt: |
    help me with social media
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    # The Bolta skill owns this ask.
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(bolta)"'
    min: 1
  - name: looks-first
    # Reads the accounts before proposing.
    type: tool_used
    tool: mcp__plugin_bolta_bolta__list-accounts
    min: 1
  - name: no-site-reread
    # A business record exists: reuse it (a re-read overwrites it).
    type: tool_used
    tool: mcp__plugin_bolta_bolta__extract-business-dna
    min: 0
    max: 0
  - name: plans-routines
    # Asks Bolta's planner (or the templates) for repeating work, not one-off posts.
    type: regex
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(recommend-routines|plan-routine|list-routine-templates)"'
    target: trace
  - name: three-or-more
    # At least 3 numbered routines in the reply.
    type: regex
    pattern: '(?:^|\n)\s*(?:[*_]{1,2})?3[.)]'
  - name: five-at-most
    # No sixth numbered routine.
    type: regex
    pattern: '(?:^|\n)\s*(?:[*_]{1,2})?6[.)]\s'
    match: not_contains
  - name: weekly-not-daily
    # Sized to review time: never daily to start.
    type: regex
    pattern: '\b(daily|every day)\b'
    flags: i
    match: not_contains
  - name: fits-the-business
    # The proposal is about candles, not generic content.
    type: regex
    pattern: 'candle|scent|pour|wax|gift'
    flags: i
  - name: voice-offered
    # The voice is part of getting going: offered or made from what Bolta knows about the business.
    type: regex
    pattern: '(set up|make|create|build|start)[^.\n]{0,60}\bvoice|\bvoice\b[^.\n]{0,80}(from your (site|website|business)|set up|ready|made|created)'
    flags: i
  - name: at-most-two-questions
    # At most 2 questions in the reply.
    type: regex
    pattern: '(?:\?(?=[\s*_)\]]|$)[\s\S]*){3}'
    match: not_contains
  - name: nothing-saved-yet
    # A proposal, not a setup: no routine, campaign or post saved before a yes.
    type: regex
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(confirm-plan|create-routine|create-content-campaign|create-post|bulk-create-posts)"'
    target: trace
    match: not_contains
  - name: nothing-public
    # Nothing approved, scheduled, published, switched on, run or started without a yes to those items.
    type: regex
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(publish-post|schedule-post|approve-post|approve-many-posts|activate-routine|resume-routine|run-routine-now|set-content-campaign-status)"'
    target: trace
    match: not_contains
  - name: no-ids
    # No ids in what the user reads.
    type: regex
    pattern: '\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b|facebook_page_\d'
    flags: i
    match: not_contains
  - name: plain-words
    # Plain words for a beginner: no tool names, internal names or jargon from the never-say list.
    type: regex
    pattern: '\b(MCP|OAuth|connector|fingerprint|workflow definition|source[_ ]binding|template[_ ]key|proposal[_ ]id|workspace_id|Business DNA|Hype[- ]Man|Hunter|Engager|artifact|recommend-routines|confirm-plan|plan-campaign|create-post|reject-post|get-connect-link|extract-business-dna)\b'
    match: not_contains
  - name: beginner-gets-a-plan
    # A total beginner gets a concrete plan without homework.
    type: llm
    criteria: |
      Business facts the assistant was given by Bolta (the only facts it has): Wick & Ember Candles, small-batch soy candles hand-poured in Asheville, North Carolina; website wickandember.example; cotton wicks; scents named after places in the Blue Ridge; sold online and at weekend markets. Products: Cedar Smoke candle (fall collection), Fireside Chai candle (fall collection), Blue Ridge Morning candle, Holiday gift set (three mini candles). Audience: people buying a gift, and people who like a cozy home. There are NO prices, sales figures, review counts, ratings, testimonials, discounts or customer quotes anywhere in what Bolta holds.

      The user, a beginner, wrote only: "help me with social media". Instagram and Facebook are connected. PASS only if all hold: (1) the reply proposes 3 to 5 repeating weekly jobs for social posts, each clearly about this candle business (scents, the making, gifts, markets and so on), each with a day or rhythm; (2) it does not make the user describe their business or products before they get a plan; (3) it is written in plain everyday words a non-marketer understands; (4) it ends by asking which to set up or with another clear next step (offering an alternative as well is fine). Judge the outcome, not the style. Otherwise FAIL.
