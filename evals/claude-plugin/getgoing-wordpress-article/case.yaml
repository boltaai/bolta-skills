schema_version: "1.1"
name: getgoing-wordpress-article
description: 'Publish an article to WordPress from an AI app: it is saved as a draft or sent for review, with a clear next step; never published, scheduled or claimed as live.'
tags: [getgoing]
expected_outcome: 'bolta fires; create-wordpress-blog-post with no publish or schedule action; no publish-post, schedule-post or approve-post; reply says it is a draft or waiting for review, gives the next step, and never says it is live.'
execution:
  prompt: |
    Publish this article to our WordPress.

    # How to brew cold brew at home

    Cold brew is easier than it looks. You need coarse ground coffee, cold water, a jar and a day.

    ## The ratio

    Use one part coffee to eight parts water. Stir, cover, and leave it in the fridge for 16 to 18 hours.

    ## Straining

    Pour it through a paper filter. It keeps in the fridge for a week. Dilute it with water or milk to taste.
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    # The Bolta skill owns getting social going.
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(bolta)"'
    min: 1
  - name: saves-the-article
    # The article is saved in Bolta for WordPress.
    type: tool_used
    tool: mcp__plugin_bolta_bolta__create-wordpress-blog-post
    min: 1
  - name: no-publish-action
    # Saved as a draft or sent for review, never published or scheduled from the AI app.
    type: tool_used
    tool: mcp__plugin_bolta_bolta__create-wordpress-blog-post
    input_match: '"requested_action"\W{1,6}(publish|schedule)|"scheduled_time"\W{1,6}\d'
    min: 0
    max: 0
  - name: no-publish-call
    # No separate publish, schedule or approval.
    type: regex
    pattern: '"name"\s*:\s*"mcp__plugin_bolta_bolta__(publish-post|schedule-post|approve-post|approve-many-posts)"'
    target: trace
    match: not_contains
  - name: says-draft-or-review
    # Says where it is: a draft, or waiting for review.
    type: regex
    pattern: '\bdraft\b|review'
    flags: i
  - name: never-claims-live
    # Never says it was published or is live.
    type: regex
    pattern: '(?<!not |n.t |never |isn.t |before it.s |once it.s |when it.s )\b(is now live|now live on|went live|has been published|is published|was published|published (it|your article|the article)( to| on)?)\b'
    flags: i
    match: not_contains
  - name: next-step
    # Gives the next step: review, approve, or say the word to publish.
    type: regex
    pattern: 'approve|review|preview|say (yes|the word|go)|when you.re ready|(publish|post)( it)?( now| live)?\?|go live\?'
    flags: i
  - name: no-ids
    # No ids in what the user reads.
    type: regex
    pattern: '\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b'
    flags: i
    match: not_contains
